name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR/dev runs are cancelled; every main run completes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Lint, Type Check, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: web-app/.nvmrc
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gym
          POSTGRES_PASSWORD: gym
          POSTGRES_DB: gym_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gym -d gym_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: web-app/.nvmrc
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Integration tests
        run: npm run test:integration
        env:
          TEST_POSTGRES_URL: postgres://gym:gym@localhost:5432/gym_test

  e2e:
    name: End-to-end (Playwright)
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.57 has no Chromium build for.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web-app

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gym
          POSTGRES_PASSWORD: gym
          POSTGRES_DB: gym_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gym -d gym_e2e"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_DRIVER: pg
      POSTGRES_URL: postgres://gym:gym@localhost:5432/gym_e2e
      DB_SSL_DISABLED: "true"
      JWT_SECRET: ci-e2e-jwt-secret
      DEFAULT_COACH_PHONE: "+910000000001"
      DEFAULT_COACH_EMAIL: coach@example.com
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_BASE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: web-app/.nvmrc
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start app
        run: |
          npx next start -p 3000 > next-start.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/login && exit 0
            sleep 1
          done
          echo "App did not start"; cat next-start.log; exit 1

      - name: Playwright
        run: npx playwright test --reporter=list,html

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web-app/playwright-report/
            web-app/next-start.log
          retention-days: 7

  dependency-audit:
    name: Dependency audit (report-only)
    runs-on: ubuntu-latest
    # Report-only until the Phase 3 upgrades land; then this becomes blocking.
    continue-on-error: true
    defaults:
      run:
        working-directory: web-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: web-app/.nvmrc

      - name: npm audit (production deps, high+)
        run: npm audit --omit=dev --audit-level=high
